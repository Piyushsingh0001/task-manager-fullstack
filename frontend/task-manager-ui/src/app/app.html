<div class="container">
  <h1>Task Manager</h1>

  <div *ngIf="isLoading">Loading tasks...</div>

  <ul *ngIf="!isLoading">
    <li *ngFor="let task of tasks">
      <span [class.done]="task.isCompleted">
        {{ task.title }}
      </span>
      <small>
        {{ task.isCompleted ? 'Completed' : 'Pending' }}
      </small>
    </li>
  </ul>
</div>
